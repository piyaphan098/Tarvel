<style>
:root{--ink:#4a3328;--pink:#e0708f;--sky:#bfe6ff;--brown:#8a5634;

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{height:100%;overflow-x:hidden;overscroll-behavior-x:none}
.lay{position:fixed;inset:0;overflow:hidden;pointer-events:none}
body{margin:0;min-height:100%;font-family:'Mali','Noto Sans Thai Looped','Sarabun',sans-serif;color:var(--ink);
background:linear-gradient(#5a3d8a,#b36bb5 45%,#ff9f6e 85%,#ffd9a8);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:16px;overflow-x:hidden}
h1{margin:0;font-size:1.4rem;font-weight:600;text-align:center;color:#fff;text-shadow:0 2px 6px rgba(60,20,80,.4)}
#cap{min-height:3em;margin:0;text-align:center;font-size:1.1rem;max-width:19em;color:#fff;text-shadow:0 1px 4px rgba(60,20,80,.5)}
.cloud{position:absolute;width:110px;height:34px;border-radius:30px;background:#fff;opacity:.3;animation:drift 28s linear infinite;z-index:0}
.cloud::before,.cloud::after{content:'';position:absolute;background:#fff;border-radius:50%}

@keyframes drift{from{transform:translateX(-160px)}to{transform:translateX(110vw)}}
#stage{position:relative;z-index:1;width:min(88vw,320px);height:360px;cursor:pointer;touch-action:manipulation}
#bear{position:absolute;left:50%;top:0;width:170px;margin-left:-85px;animation:wave 2.4s ease-in-out infinite;transform-origin:50% 100%}
@keyframes wave{50%{transform:rotate(3deg)}}
.case{position:absolute;left:50%;bottom:6px;width:230px;height:150px;margin-left:-115px}
.back{position:absolute;inset:0;border-radius:18px;background:#a64a67}
.slot{position:absolute;top:8px;left:0;right:0;height:60px}
.item{position:absolute;font-size:2rem;animation:drop .6s ease-in forwards}
@keyframes drop{from{transform:translateY(-120px) rotate(-30deg);opacity:0}to{transform:translateY(20px) rotate(0);opacity:1}}
.front{position:absolute;left:0;right:0;bottom:0;height:62%;border-radius:8px 8px 18px 18px;background:var(--pink);box-shadow:inset 0 -8px 0 rgba(0,0,0,.08)}
.front::before,.front::after{content:'';position:absolute;top:0;bottom:0;width:14px;background:#c0587a}
.front::before{left:26%}.front::after{right:26%}
.lid{position:absolute;left:-4px;right:-4px;top:0;height:46%;border-radius:18px 18px 4px 4px;background:#ee86a3;transform:scaleY(0);transform-origin:top;transition:transform .6s}
.closed .lid{transform:scaleY(1)}
.handle{position:absolute;left:50%;top:-22px;width:70px;height:26px;margin-left:-35px;border:7px solid #7a3550;border-bottom:0;border-radius:16px 16px 0 0}
.tag{position:absolute;right:-8px;top:30px;background:#fff;border:2px solid #ffd36b;border-radius:6px;padding:2px 6px;font-size:.7rem;transform:rotate(8deg);z-index:3}
#snd{position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);right:12px;z-index:20;width:42px;height:42px;border-radius:50%;border:0;background:rgba(255,255,255,.25);font-size:1.2rem;cursor:pointer;display:none}
.moon{position:absolute;top:7%;left:9%;width:54px;height:54px;border-radius:50%;background:#ffe9a8;box-shadow:0 0 30px 8px rgba(255,233,168,.5);z-index:0}
.bat{position:absolute;right:-6px;top:6px;width:46px;animation:bob 2.6s ease-in-out infinite}
.bat path{transform-box:fill-box;transform-origin:center;animation:fl .35s ease-in-out infinite alternate}
@keyframes bob{50%{transform:translate(-8px,10px)}}
@keyframes fl{to{transform:scaleY(.6)}}
#plane{position:absolute;left:0;top:20%;width:min(92vw,430px);pointer-events:none;opacity:0;transform:translateX(-120%)}

#plane.fly{animation:fly 3.2s cubic-bezier(.5,0,.8,.6) forwards}
@keyframes fly{0%{opacity:1;transform:translate(-110%,70px) rotate(0)}30%{transform:translate(10vw,30px) rotate(-1deg)}100%{opacity:1;transform:translate(calc(100vw + 20%),-170px) rotate(-12deg)}}
.pc{position:absolute;left:0;width:140px;height:44px;border-radius:40px;background:#fff;opacity:.8;pointer-events:none;transform-origin:left center;animation:pass 2.6s linear forwards}
.pc::before,.pc::after{content:'';position:absolute;background:#fff;border-radius:50%}
.pc::before{width:60px;height:60px;left:20px;top:-30px}.pc::after{width:46px;height:46px;left:72px;top:-20px}
@keyframes pass{from{transform:translateX(105vw) scale(var(--s))}to{transform:translateX(-80vw) scale(var(--s))}}
#over{position:fixed;inset:0;z-index:5;display:none;align-items:center;justify-content:center;padding:18px;background:rgba(58,34,88,.9)}
#over.show{display:flex;animation:fade .7s}
@keyframes fade{from{opacity:0}to{opacity:1}}
.pass{overscroll-behavior:contain;width:min(92vw,350px);max-height:92vh;overflow:auto;background:#fff;border-radius:20px;box-shadow:0 14px 40px rgba(40,90,130,.3);animation:up .8s ease-out}

.msg{padding:16px 20px;white-space:pre-line;line-height:1.8;text-align:center;font-size:.98rem}
.bar{height:40px;margin:2px 18px 12px;background:repeating-linear-gradient(90deg,#4a3328 0 2px,#fff 2px 5px,#4a3328 5px 6px,#fff 6px 10px,#4a3328 10px 13px,#fff 13px 15px)}
.pass button{display:block;margin:0 auto 16px;border:0;border-radius:20px;padding:8px 18px;background:#ffe9a8;color:var(--ink);font:600 .95rem 'Mali',sans-serif;cursor:pointer}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:30}
.fl{position:absolute;bottom:-50px;pointer-events:none;animation:float 4s ease-out forwards}
@keyframes float{to{transform:translate(var(--dx),-108vh) rotate(25deg);opacity:0}}
.sr{display:flex;justify-content:center;padding:2px 0 8px}

.jp{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:6px 14px 12px}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

<script>
// ===== แก้ตรงนี้ได้ (หรือใส่ในลิงก์: ?to=ชื่อ&dest=ปลายทาง&date=วันที่) =====
var NAME = "คนเก่ง", DEST = "Japan", DATE = "28 ต.ค.";

var ITEMS = [["📷","ถ่ายรูปสวยๆ มาให้ดูด้วยนะ"],["🍜","ขอให้ได้กินของอร่อยๆ ทุกมื้อ"],["🎃","ขอให้สนุกกับฮาโลวีนที่ญี่ปุ่น"],["🍀","และกลับมาอย่างปลอดภัยนะ"]];
// ===================================================================
var P = new URLSearchParams(location.search);
NAME = P.get("to") || NAME; DEST = (P.get("dest") || DEST).toUpperCase(); DATE = P.get("date") || DATE;
var $ = function(i){return document.getElementById(i)}, n = 0, AC = null;
function ting(f){
  try{ var C = window.AudioContext || window.webkitAudioContext; if(!AC) AC = new C(); if(AC.state==="suspended") AC.resume();
  var o = AC.createOscillator(), g = AC.createGain(), t = AC.currentTime; o.type="triangle"; o.frequency.value=f;
  g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(.2,t+.01); g.gain.exponentialRampToValueAtTime(.0001,t+.6);
  o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t+.7);}catch(e){}
}
var YT = "31wt1SahLVo", ytf = null, musicOn = true;   // เพลง: Fly Me to the Moon (บรรเลง) ใส่ไอดีวิดีโอ YouTube ตรงนี้
function startMusic(){

  var f = document.createElement("iframe");
  f.allow = "autoplay; encrypted-media"; f.title = "music";

var PH = [["ありがとう","อาริงาโตะ","ขอบคุณ"],["すみません","สุมิมาเซ็น","ขอโทษ / ขอทาง"],["おいしい！","โออิชี","อร่อย!"],["トイレはどこですか","โทะอิเระ วะ โดโกะ เดสึ คะ","ห้องน้ำอยู่ไหน"]];

});
function fx(){
  if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  var c = $("fx"), x = c.getContext("2d"), P = [], cols = ["#ff8a2a","#ffd36b","#c9a6ff","#ff8fb3","#8fd3ff","#ffffff"];
