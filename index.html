<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>เดินทางปลอดภัยนะ ✈️</title>
<link href="https://fonts.googleapis.com/css2?family=Mali:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#4a3328;--pink:#e0708f;--sky:#bfe6ff;--brown:#8a5634;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{height:100%}
body{margin:0;min-height:100%;font-family:'Mali','Noto Sans Thai Looped','Sarabun',sans-serif;color:var(--ink);
background:linear-gradient(#a9dcff,#e9f7ff 60%,#fff8ec);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:16px;overflow-x:hidden}
h1{margin:0;font-size:1.4rem;font-weight:600;text-align:center;color:#2f6f9f}
#cap{min-height:3em;margin:0;text-align:center;font-size:1.1rem;max-width:19em}
.cloud{position:fixed;width:110px;height:34px;border-radius:30px;background:#fff;opacity:.85;animation:drift 28s linear infinite;z-index:0}
.cloud::before,.cloud::after{content:'';position:absolute;background:#fff;border-radius:50%}
.cloud::before{width:48px;height:48px;left:16px;top:-24px}.cloud::after{width:36px;height:36px;left:56px;top:-16px}
@keyframes drift{from{transform:translateX(-160px)}to{transform:translateX(110vw)}}
#stage{position:relative;z-index:1;width:min(88vw,320px);height:330px;cursor:pointer;touch-action:manipulation}
#bear{position:absolute;left:50%;top:0;width:170px;margin-left:-85px;animation:wave 2.4s ease-in-out infinite;transform-origin:50% 100%}
@keyframes wave{50%{transform:rotate(3deg)}}
.case{position:absolute;left:50%;bottom:6px;width:230px;height:150px;margin-left:-115px}
.back{position:absolute;inset:0;border-radius:18px;background:#a64a67}
.slot{position:absolute;top:8px;left:0;right:0;height:60px}
.item{position:absolute;font-size:2rem;animation:drop .6s ease-in forwards}
@keyframes drop{from{transform:translateY(-120px) rotate(-30deg);opacity:0}to{transform:translateY(20px) rotate(0);opacity:1}}
.front{position:absolute;left:0;right:0;bottom:0;height:62%;border-radius:8px 8px 18px 18px;background:var(--pink);box-shadow:inset 0 -8px 0 rgba(0,0,0,.08)}
.front::before,.front::after{content:'';position:absolute;top:0;bottom:0;width:14px;background:#c0587a}
.front::before{left:26%}.front::after{right:26%}
.lid{position:absolute;left:-4px;right:-4px;top:0;height:46%;border-radius:18px 18px 4px 4px;background:#ee86a3;transform:scaleY(0);transform-origin:top;transition:transform .6s}
.closed .lid{transform:scaleY(1)}
.handle{position:absolute;left:50%;top:-22px;width:70px;height:26px;margin-left:-35px;border:7px solid #7a3550;border-bottom:0;border-radius:16px 16px 0 0}
.tag{position:absolute;right:-8px;top:30px;background:#fff;border:2px solid #ffd36b;border-radius:6px;padding:2px 6px;font-size:.7rem;transform:rotate(8deg);z-index:3}
#plane{position:fixed;left:-80px;top:22%;font-size:3.2rem;z-index:6;pointer-events:none;opacity:0}
#plane.fly{animation:fly 2.4s ease-in forwards}
@keyframes fly{0%{opacity:1;transform:translate(0,60px) rotate(-8deg)}100%{opacity:1;transform:translate(120vw,-140px) rotate(-18deg)}}
#over{position:fixed;inset:0;z-index:5;display:none;align-items:center;justify-content:center;padding:18px;background:rgba(210,238,255,.92)}
#over.show{display:flex;animation:fade .7s}
@keyframes fade{from{opacity:0}to{opacity:1}}
.pass{width:min(92vw,350px);max-height:92vh;overflow:auto;background:#fff;border-radius:20px;box-shadow:0 14px 40px rgba(40,90,130,.3);animation:up .8s ease-out}
@keyframes up{from{transform:translateY(60px) scale(.9);opacity:0}to{transform:none;opacity:1}}
.ph{display:flex;justify-content:space-between;align-items:center;background:#2f6f9f;color:#fff;padding:12px 18px;border-radius:20px 20px 0 0;font-weight:600;letter-spacing:.06em}
.row{display:flex;justify-content:space-between;align-items:center;padding:16px 18px 6px}
.row b{display:block;font-size:1.5rem;line-height:1.1;color:#2f6f9f}.row small{font-size:.68rem;color:#8a7a70;letter-spacing:.08em}
.row .pl{font-size:1.8rem}
.meta{display:grid;grid-template-columns:1fr 1fr;gap:8px 12px;padding:6px 18px 12px;font-size:.92rem}
.meta small{display:block;font-size:.64rem;color:#8a7a70;letter-spacing:.08em}
.tear{position:relative;margin:4px 0;border-top:2px dashed #cfe3f0}
.tear::before,.tear::after{content:'';position:absolute;top:-13px;width:24px;height:24px;border-radius:50%;background:#d8efff}
.tear::before{left:-12px}.tear::after{right:-12px}
.msg{padding:16px 20px;white-space:pre-line;line-height:1.8;text-align:center;font-size:.98rem}
.bar{height:40px;margin:2px 18px 12px;background:repeating-linear-gradient(90deg,#4a3328 0 2px,#fff 2px 5px,#4a3328 5px 6px,#fff 6px 10px,#4a3328 10px 13px,#fff 13px 15px)}
.pass button{display:block;margin:0 auto 16px;border:0;border-radius:20px;padding:8px 18px;background:#ffe9a8;color:var(--ink);font:600 .95rem 'Mali',sans-serif;cursor:pointer}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="cloud" style="top:8%;animation-duration:34s"></div>
<div class="cloud" style="top:30%;animation-duration:26s;animation-delay:-12s;opacity:.6"></div>
<div class="cloud" style="top:62%;animation-duration:40s;animation-delay:-20s;opacity:.7"></div>
<div id="plane">✈️</div>

<h1>🧳 เก็บกระเป๋าก่อนไปนะ</h1>
<div id="stage" role="button" aria-label="แตะเพื่อใส่ของลงกระเป๋า">
 <svg id="bear" viewBox="0 0 200 190">
  <defs><radialGradient id="fg" cx="45%" cy="35%" r="70%"><stop offset="0" stop-color="#a06a40"/><stop offset="1" stop-color="#6a3f26"/></radialGradient></defs>
  <circle cx="45" cy="42" r="30" fill="url(#fg)"/><circle cx="155" cy="42" r="30" fill="url(#fg)"/>
  <circle cx="45" cy="44" r="15" fill="#e8b496"/><circle cx="155" cy="44" r="15" fill="#e8b496"/>
  <circle cx="100" cy="100" r="80" fill="url(#fg)"/>
  <ellipse cx="100" cy="128" rx="32" ry="24" fill="#d9a070"/>
  <ellipse cx="58" cy="124" rx="14" ry="9" fill="#ff8fa3" opacity=".6"/><ellipse cx="142" cy="124" rx="14" ry="9" fill="#ff8fa3" opacity=".6"/>
  <ellipse cx="100" cy="116" rx="10" ry="7" fill="#3d2216"/><ellipse cx="97" cy="113.5" rx="3.5" ry="1.8" fill="#fff" opacity=".5"/>
  <path d="M100 123v4M100 127q-6 6-12 1M100 127q6 6 12 1" stroke="#3d2216" stroke-width="2.2" fill="none" stroke-linecap="round"/>
  <circle cx="64" cy="98" r="11" fill="#1d1109"/><circle cx="136" cy="98" r="11" fill="#1d1109"/>
  <circle cx="60" cy="94" r="4" fill="#fff"/><circle cx="132" cy="94" r="4" fill="#fff"/><circle cx="68" cy="103" r="2" fill="#fff" opacity=".8"/><circle cx="140" cy="103" r="2" fill="#fff" opacity=".8"/>
  <path d="M46 30Q100 -2 154 30L148 42Q100 18 52 42z" fill="#2f6f9f"/><rect x="46" y="38" width="108" height="8" rx="4" fill="#fff"/>
 </svg>
 <div class="case" id="case">
  <div class="handle"></div><div class="back"></div><div class="slot" id="slot"></div>
  <div class="front"></div><div class="lid"></div><div class="tag" id="tag">✈ ไปด้วยกัน</div>
 </div>
</div>
<p id="cap">แตะที่กระเป๋าเพื่อเริ่มใส่ของ 🧳</p>

<div id="over"><div class="pass">
 <div class="ph"><span>BOARDING PASS</span><span>✈</span></div>
 <div class="row"><div><small>FROM</small><b>HOME</b></div><div class="pl">✈️</div><div style="text-align:right"><small>TO</small><b id="dest"></b></div></div>
 <div class="meta"><div><small>PASSENGER</small><span id="nm"></span></div><div><small>FLIGHT</small>HAPPY TRIP</div><div><small>DATE</small><span id="dt"></span></div><div><small>SEAT</small>ริมหน้าต่าง</div></div>
 <div class="tear"></div>
 <div class="msg" id="msg"></div>
 <div class="bar"></div>
 <button id="again">ดูอีกครั้ง</button>
</div></div>

<script>
// ===== แก้ตรงนี้ได้ (หรือใส่ในลิงก์: ?to=ชื่อ&dest=ปลายทาง&date=วันที่) =====
var NAME = "คนเก่ง", DEST = "Japan", DATE = "28 ต.ค.";
var MESSAGE = "เดินทางปลอดภัยนะ {name} ✈️\n(いってらっしゃい)\n\nขอให้เที่ยวญี่ปุ่นสนุกสุดๆ\nได้เจอที่สวยๆ ได้กินของอร่อยๆ และยิ้มได้ทุกวัน\n\nถ้าเจออะไรน่ารักๆ ก็ถ่ายมาให้ดูบ้างนะ\n\nปล. หมีฝากไปเป็นเพื่อนในกระเป๋าด้วย 🧸\nไว้กลับมาเล่าให้ฟังนะ";
var ITEMS = [["📷","เก็บภาพสวยๆ มาเยอะๆ นะ"],["🍜","ขอให้ได้กินของอร่อยๆ ทุกมื้อ"],["⛩️","ขอให้เจอที่เที่ยวสวยๆ ทุกที่"],["🍀","และกลับมาอย่างปลอดภัยนะ"]];
// ===================================================================
var P = new URLSearchParams(location.search);
NAME = P.get("to") || NAME; DEST = (P.get("dest") || DEST).toUpperCase(); DATE = P.get("date") || DATE;
var $ = function(i){return document.getElementById(i)}, n = 0, AC = null;
function ting(f){
  try{ var C = window.AudioContext || window.webkitAudioContext; if(!AC) AC = new C(); if(AC.state==="suspended") AC.resume();
  var o = AC.createOscillator(), g = AC.createGain(), t = AC.currentTime; o.type="triangle"; o.frequency.value=f;
  g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(.2,t+.01); g.gain.exponentialRampToValueAtTime(.0001,t+.6);
  o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t+.7);}catch(e){}
}
var XS = [14, 62, 110, 158];
$("stage").addEventListener("click", function(){
  if (n >= ITEMS.length) return;
  var s = document.createElement("span"); s.className = "item"; s.textContent = ITEMS[n][0]; s.style.left = XS[n] + "px"; $("slot").appendChild(s);
  $("cap").textContent = ITEMS[n][1]; ting([523,659,784,1047][n]); n++;
  if (n === ITEMS.length) {
    setTimeout(function(){ $("case").classList.add("closed"); $("cap").textContent = "ปิดกระเป๋า… พร้อมออกเดินทาง! ✈️"; }, 1000);
    setTimeout(function(){ $("plane").classList.add("fly"); }, 2200);
    setTimeout(function(){
      $("dest").textContent = DEST; $("nm").textContent = NAME; $("dt").textContent = DATE;
      $("msg").textContent = MESSAGE.replace("{name}", NAME); $("over").classList.add("show");
    }, 3800);
  }
});
$("again").addEventListener("click", function(){ location.reload(); });
</script>
</body>
</html>
